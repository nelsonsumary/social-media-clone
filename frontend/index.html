<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SocialClone</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
  <div id="app"></div>

  <!-- Template: Verification Message (overlay) -->
  <template id="page-verify-message">
    <div class="auth-container">
      <div class="auth-card">
        <h1>Email Verification</h1>
        <p id="verify-status" style="text-align:center;margin:20px 0"></p>
        <button id="btn-verify-login" class="btn-full" style="display:none">Go to Login</button>
      </div>
    </div>
  </template>

  <!-- Template: Auth -->
  <template id="page-auth">
    <div class="auth-container">
      <div class="auth-card">
        <h1 class="brand-shimmer">SocialClone</h1>
        <div class="auth-tabs">
          <button class="tab active" data-tab="login">Login</button>
          <button class="tab" data-tab="signup">Sign Up</button>
        </div>
        <form id="form-login" class="auth-form">
          <input type="text" name="email" id="login-email" placeholder="Email or username" required />
          <input type="password" name="password" id="login-password" placeholder="Password" required />
          <label class="show-password-label"><input type="checkbox" class="show-password" data-target="login-password" /> Show password</label>
          <button type="submit" id="login-submit-btn">Log In</button>
          <a href="#" id="btn-forgot-password" class="forgot-password-link">Forgot password?</a>
          <p class="auth-error" id="login-error"></p>
        </form>
        <div id="login-2fa-challenge" class="auth-form hidden">
          <p style="text-align:center;font-size:14px;color:var(--text-secondary)">Enter the 6-digit code from your authenticator app</p>
          <input type="text" id="login-2fa-code" placeholder="000000" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" />
          <button type="button" id="login-2fa-submit-btn">Verify</button>
          <button type="button" id="login-2fa-back-btn" class="forgot-password-link">Back to Login</button>
          <p class="auth-error" id="login-2fa-error"></p>
        </div>
        <form id="form-signup" class="auth-form hidden">
          <input type="text" name="username" placeholder="Username" required />
          <input type="email" name="email" placeholder="Email" required />
          <input type="password" name="password" id="signup-password" placeholder="Password (min 6 chars)" minlength="6" required />
          <label class="show-password-label"><input type="checkbox" class="show-password" data-target="signup-password" /> Show password</label>
          <button type="submit">Create Account</button>
          <p class="auth-error" id="signup-error"></p>
        </form>
        <div class="auth-divider">or</div>
        <div id="google-button-container" class="google-btn-wrapper"></div>
        <div class="oauth-buttons">
          <p class="oauth-label">Continue with</p>
          <button class="oauth-btn oauth-facebook" data-provider="facebook">Facebook</button>
          <button class="oauth-btn oauth-linkedin" data-provider="linkedin">LinkedIn</button>
        </div>
      </div>
    </div>
  </template>

  <!-- Template: Forgot Password -->
  <template id="page-forgot-password">
    <div class="auth-container">
      <div class="auth-card">
        <h1>Reset Password</h1>
        <p style="text-align:center;color:var(--text-secondary);margin-bottom:16px">Enter your email and we'll send you a reset link.</p>
        <form id="form-forgot-password" class="auth-form">
          <input type="email" name="email" placeholder="Your email" required />
          <button type="submit">Send Reset Link</button>
          <p class="auth-error" id="forgot-error"></p>
        </form>
        <p style="text-align:center;margin-top:12px"><a href="#" id="btn-back-to-login" class="forgot-password-link">Back to Login</a></p>
      </div>
    </div>
  </template>

  <!-- Template: Reset Password (from email link) -->
  <template id="page-reset-password">
    <div class="auth-container">
      <div class="auth-card">
        <h1>Set New Password</h1>
        <p style="text-align:center;color:var(--text-secondary);margin-bottom:16px">Enter your new password below.</p>
        <form id="form-reset-password" class="auth-form">
          <input type="password" name="password" id="reset-password-input" placeholder="New password (min 6 chars)" minlength="6" required />
          <label class="show-password-label"><input type="checkbox" class="show-password" data-target="reset-password-input" /> Show password</label>
          <button type="submit">Reset Password</button>
          <p class="auth-error" id="reset-error"></p>
        </form>
      </div>
    </div>
  </template>

  <!-- Template: App Shell -->
  <template id="page-app">
    <div class="app-layout">
      <nav class="sidebar">
        <div class="sidebar-header">
          <h2 class="brand-shimmer">SocialClone</h2>
        </div>
        <ul class="sidebar-nav">
          <li><button class="nav-btn active" data-view="feed">Feed</button></li>
          <li><button class="nav-btn" data-view="messages">Messages</button></li>
          <li>
            <button class="nav-btn" data-view="notifications">
              Notifications
              <span id="notif-badge" class="notif-badge hidden">0</span>
            </button>
          </li>
          <li><button class="nav-btn" data-view="profile">Profile</button></li>
          <li><button class="nav-btn" data-view="users">Find Users</button></li>
        </ul>
        <div class="sidebar-footer">
          <div class="sidebar-footer-top">
            <span id="sidebar-username"></span>
          </div>
          <div class="dark-mode-row">
            <span class="dark-mode-label">Dark Mode</span>
            <label class="toggle-switch">
              <input type="checkbox" id="btn-dark-mode" />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <button id="btn-logout">Logout</button>
        </div>
      </nav>
      <main class="main-content" id="main-content">
        <div class="mobile-header" id="mobile-header">
          <h2 class="brand-shimmer">SocialClone</h2>
          <div class="mobile-header-actions">
            <label class="toggle-switch">
              <input type="checkbox" id="btn-dark-mode-mobile" />
              <span class="toggle-slider"></span>
            </label>
            <button id="btn-logout-mobile">Logout</button>
          </div>
        </div>
        <div id="verification-banner" class="verification-banner hidden">
          Please verify your email to post and send messages.
          <button id="btn-resend-verify" class="resend-btn">Resend email</button>
        </div>
        <div id="page-content"></div>
      </main>
    </div>
    <nav class="bottom-nav" id="bottom-nav">
      <button class="nav-btn active" data-view="feed">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Feed</span>
      </button>
      <button class="nav-btn" data-view="messages">
        <span class="nav-icon">💬</span>
        <span class="nav-label">Chat</span>
      </button>
      <button class="nav-btn" data-view="notifications">
        <span class="nav-icon">🔔</span>
        <span class="nav-label">Alerts</span>
        <span id="notif-badge-mobile" class="notif-badge hidden">0</span>
      </button>
      <button class="nav-btn" data-view="profile">
        <span class="nav-icon">👤</span>
        <span class="nav-label">Profile</span>
      </button>
      <button class="nav-btn" data-view="users">
        <span class="nav-icon">🔍</span>
        <span class="nav-label">Find</span>
      </button>
    </nav>
  </template>

  <!-- Template: Feed -->
  <template id="page-feed">
    <div class="feed-container">
      <h2>Feed</h2>
      <div class="create-post" id="create-post-area">
        <textarea id="post-content" rows="3" placeholder="What's on your mind?"></textarea>
        <div class="create-post-actions">
          <label class="btn-img">
            Attach Image
            <input type="file" id="post-image" accept="image/*" hidden />
          </label>
          <button id="btn-post">Post</button>
        </div>
        <p class="upload-status" id="post-status"></p>
      </div>
      <div id="feed-posts"></div>
    </div>
  </template>

  <!-- Template: Messages -->
  <template id="page-messages">
    <div class="messages-container">
      <h2>Messages</h2>
      <div class="messages-layout">
        <div class="conversations-list" id="conversations-list"></div>
        <div class="message-view" id="message-view">
          <div class="message-header" id="message-header"></div>
          <div class="message-body" id="message-body"></div>
          <div class="message-input-area" id="message-input-area">
            <input type="text" id="message-input" placeholder="Type a message..." />
            <button id="btn-send-message">Send</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- Template: Profile -->
  <template id="page-profile">
    <div class="profile-container">
      <div id="profile-skeleton" class="sk-profile hidden">
        <div class="sk-row"><div class="sk-avatar" style="width:96px;height:96px;flex-shrink:0"></div><div style="flex:1"><div class="sk-row" style="justify-content:space-between"><div class="sk-line" style="width:120px;height:20px"></div><div class="sk-line" style="width:32px;height:32px;border-radius:8px"></div></div><div class="sk-row" style="justify-content:space-around;margin-top:10px"><div class="sk-line" style="width:50px;height:32px;border-radius:4px"></div><div class="sk-line" style="width:50px;height:32px;border-radius:4px"></div><div class="sk-line" style="width:50px;height:32px;border-radius:4px"></div></div></div></div><div class="sk-line" style="width:200px;height:14px;margin-top:12px"></div><div class="sk-line" style="width:260px;height:13px;margin-top:6px"></div><div class="sk-line" style="width:140px;height:12px;margin-top:6px"></div><div class="sk-line" style="width:100%;height:160px;border-radius:12px;margin-top:16px"></div></div>
      <div id="profile-content" class="hidden">
      <div class="profile-top-row">
        <div class="profile-avatar-container">
          <img id="profile-avatar" src="" alt="Avatar" class="profile-avatar-lg" />
          <button class="profile-avatar-plus" id="btn-avatar-plus" aria-label="Change profile picture">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <input type="file" id="avatar-file-input" accept="image/*" class="hidden" />
        </div>
        <div class="profile-info-area">
          <div class="profile-username-row">
            <div class="profile-username" id="profile-username"></div>
            <button class="profile-menu-btn" id="btn-profile-menu" aria-label="Assets">☰</button>
          </div>
          <div class="profile-stats-compact">
            <div class="profile-stat"><strong id="profile-post-count">0</strong><span>posts</span></div>
            <div class="profile-stat"><strong id="profile-follower-count">0</strong><span>followers</span></div>
            <div class="profile-stat"><strong id="profile-following-count">0</strong><span>following</span></div>
          </div>
        </div>
      </div>
      <div class="profile-email" id="profile-email"></div>
      <div class="profile-bio" id="profile-bio"></div>
      <div class="profile-verified" id="profile-verified"></div>
      <button class="btn-profile-edit" id="btn-toggle-edit">Edit Profile</button>
    <!-- Edit Profile Modal -->
    <div class="edit-overlay hidden" id="edit-overlay"></div>
    <div class="edit-modal hidden" id="edit-modal">
      <div class="edit-modal-header">
        <span class="edit-modal-title">Edit Profile</span>
        <button class="edit-modal-close" id="btn-edit-close" aria-label="Close">✕</button>
      </div>
      <div class="edit-modal-body">
        <div class="edit-field">
          <label class="edit-field-label">Username</label>
          <input type="text" id="edit-username" class="edit-field-input" />
          <p class="edit-field-hint">Usernames can only contain letters, numbers, underscores, and periods. Changing your username will also change your profile link.</p>
        </div>
        <div class="edit-field">
          <label class="edit-field-label">Bio</label>
          <textarea id="edit-bio" class="edit-field-textarea" maxlength="80"></textarea>
          <p class="edit-field-count"><span id="edit-bio-count">0</span>/80</p>
        </div>
        <div class="edit-modal-actions">
          <button id="btn-save-profile">Save</button>
          <button id="btn-cancel-edit" class="btn-secondary">Cancel</button>
        </div>
      </div>
    </div>
      <div class="profile-divider"></div>
      <h3 class="profile-posts-heading">Posts</h3>
      <div id="profile-posts"></div>
      <button id="btn-delete-account" class="btn-delete-account">Delete My Account</button>
      </div>
    </div>
    <!-- Assets Side Panel -->
    <div class="settings-overlay hidden" id="settings-overlay"></div>
    <div class="settings-panel hidden" id="settings-panel">
      <div class="settings-panel-header">
        <span class="settings-panel-title">Assets</span>
        <button class="settings-panel-close" id="btn-settings-close" aria-label="Close">✕</button>
      </div>
      <div class="settings-panel-body">
        <div id="settings-page-main">
          <div class="settings-section">
            <div class="settings-section-title">Security</div>
            <button class="settings-nav-item" id="btn-settings-2fa-nav">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <span>Two-Factor Authentication</span>
              <svg class="settings-nav-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>
        </div>
        <div id="settings-page-2fa" class="hidden">
          <button class="settings-back-btn" id="btn-settings-2fa-back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            Two-Factor Authentication
          </button>
          <div class="settings-2fa-body">
            <div id="settings-2fa-setup" class="hidden">
              <p class="settings-2fa-desc">Scan the QR code with your authenticator app, then enter the 6-digit code below.</p>
              <div id="settings-2fa-qr" class="settings-2fa-qr"></div>
              <p class="settings-2fa-manual">Or enter this key manually: <code id="settings-2fa-secret" class="settings-2fa-secret"></code></p>
              <div class="settings-2fa-input-row">
                <input type="text" id="settings-2fa-code" class="settings-2fa-input" placeholder="000000" maxlength="6" inputmode="numeric" pattern="[0-9]*" />
                <button id="settings-2fa-verify-btn" class="settings-2fa-btn">Verify</button>
              </div>
              <p class="auth-error" id="settings-2fa-error"></p>
            </div>
            <div id="settings-2fa-disable" class="hidden">
              <p class="settings-2fa-desc">To disable, enter your password and click disable.</p>
              <div class="settings-2fa-input-row">
                <input type="password" id="settings-2fa-password" class="settings-2fa-input" placeholder="Your password" />
                <button id="settings-2fa-disable-btn" class="settings-2fa-btn settings-2fa-btn-danger">Disable</button>
              </div>
              <p class="auth-error" id="settings-2fa-disable-error"></p>
            </div>
            <div id="settings-2fa-status-info" class="settings-2fa-status-info">
              <span id="settings-2fa-badge" class="settings-2fa-badge">—</span>
            </div>
            <button id="btn-settings-2fa-enable" class="settings-2fa-toggle-btn hidden">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
              Enable 2FA
            </button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- Template: Find Users -->
  <template id="page-users">
    <div class="users-container">
      <h2>Find Users</h2>
      <input type="text" id="user-search" placeholder="Search by username..." />
      <div id="user-results"></div>
    </div>
  </template>

  <!-- Template: Notifications -->
  <template id="page-notifications">
    <div class="notifications-container">
      <div class="notifications-header">
        <h2>Notifications</h2>
        <button id="btn-mark-all-read" class="mark-read-btn">Mark all as read</button>
      </div>
      <div id="notifications-list"></div>
    </div>
  </template>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
